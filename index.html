<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087fc4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>SnowReady</title></head><body><header><img src="icon-192.png"><div><b>SnowReady</b><div class="muted">Treina hoje. Ride amanhã.</div></div></header><main class="wrap"><section id="home" class="view on"><div class="card hero"><small>PLANO DE 13 SEMANAS</small><h2 id="phase"></h2><p id="range" class="muted"></p><div class="bar"><i id="prog"></i></div></div><div id="weeks" class="weeks"></div><div id="sessions"></div></section><section id="session" class="view"><button class="btn alt" onclick="show('home')">← Voltar</button><h2 id="sessionTitle" style="margin-top:18px"></h2><div id="exerciseList" class="card"></div><button id="startWorkout" class="btn" style="width:100%">▶ Iniciar treino</button></section><section id="run" class="view runner"><div class="label" id="runCount"></div><h2 id="runName"></h2><button class="btn alt" id="howBtn">Como fazer</button><div class="clock"><div><span id="mode">SÉRIE</span><br><b id="clock">Pronto</b><br><small id="seriesText"></small></div></div><div class="controls"><button class="btn alt" id="pauseBtn">Pausar</button><button class="btn alt" id="resetBtn">Reiniciar</button><button class="btn wide" id="mainBtn">Iniciar série</button><button class="btn alt wide" id="skipBtn">Avançar agora</button></div></section><section id="progress" class="view"><h2>Progresso</h2><div class="card" id="progressBox"></div></section><section id="settings" class="view"><h2>Definições</h2><div class="card"><label>Segunda-feira de início</label><input type="date" id="startDate"><p class="muted">O progresso fica guardado apenas neste dispositivo.</p></div></section></main><nav class="nav"><button data-v="home" class="on">🏠<br>Plano</button><button data-v="progress">📈<br>Progresso</button><button data-v="settings">⚙️<br>Definições</button></nav><div id="modal" class="modal hidden"><div><button class="btn alt" id="closeModal">Fechar</button><div class="pose">🏋️‍♂️</div><h2 id="modalTitle"></h2><div class="steps" id="modalSteps"></div><a id="videoLink" class="btn" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">▶ Procurar demonstração em vídeo</a><p class="muted" style="margin-top:12px">O vídeo abre uma pesquisa externa. Confirma sempre a técnica com um profissional se tiveres dor ou dúvidas.</p></div></div><script src="data.js"></script><script src="app.js"></script></body></html>
